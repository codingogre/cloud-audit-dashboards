<style>
/* ---- frame ---- */
/* Kibana pads the frame body 16px: the drill-down fills the box inside that padding, so its bottom is not cut off */
html,body{height:100%}body{box-sizing:border-box}
.ip{--g:24px;--row:46px;font-family:var(--cc-font-family);color:var(--cc-color-text);font-size:13px;line-height:1.35;height:100%;display:flex;flex-direction:column;gap:6px;padding:2px 4px 0;box-sizing:border-box}
.ip *{box-sizing:border-box}
.ip svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mute{color:color-mix(in srgb,var(--cc-color-text) 62%,transparent)}
/* ---- lede and breadcrumb ---- */
.lede{margin:0;font-size:12.5px}
.lede b{font-weight:600}
.hd{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;font-size:12.5px}
.hd .cut{font-size:11.5px}
.lede .warn{color:var(--cc-color-danger);font-weight:600}
.bc{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;font-size:12px;min-height:22px}
.bc-n{display:none;align-items:center;gap:4px;cursor:pointer;padding:1px 6px;border-radius:var(--cc-radius-s,4px);max-width:24ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-n:hover{background:color-mix(in srgb,var(--cc-color-text) 7%,transparent)}
.bc-n::before{content:"›";margin-right:6px;color:color-mix(in srgb,var(--cc-color-text) 45%,transparent)}
.bc-0{font-weight:600;padding-right:4px}
.bc .dot{width:6px;height:6px;border-radius:50%;background:var(--cc-color-danger);flex:none}
/* ---- columns ---- */
.mc{flex:1;min-height:0;display:grid;grid-template-columns:minmax(170px,240px) minmax(170px,240px) minmax(140px,200px) minmax(140px,200px) minmax(300px,1fr);column-gap:var(--g)}
.col{min-width:0;min-height:0;display:flex;flex-direction:column}
.cs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin-right:calc(-1 * var(--g));padding-right:var(--g);scrollbar-width:thin;mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);padding-bottom:12px}
.col h4{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:color-mix(in srgb,var(--cc-color-text) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col.objs .scroll{flex:1;min-height:0;overflow:auto;padding-right:4px;mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent)}
.grp{display:none;flex-direction:column;gap:4px;animation:colIn var(--cc-motion-normal) var(--cc-ease) backwards;animation-delay:var(--lv,0ms)}
.grp.root{display:flex}
.c2 .grp{--lv:40ms}.c3 .grp{--lv:80ms}.c4 .grp{--lv:120ms}.objs .grp{--lv:160ms}
@keyframes colIn{from{opacity:0;transform:translateX(-6px)}}
/* backwards, not both: a transform left filling after the entrance would make each column the containing block of the fixed request panel inside it */
/* ---- an item (levels 1-4): the radio, then a sibling box styled by `input:checked + .bx` ---- */
.it{position:relative;display:block;min-height:var(--row);cursor:pointer}
.it input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.bx{position:relative;display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:7px;align-items:center;min-height:var(--row);padding:5px 8px 8px;border-radius:var(--cc-radius-s,4px);border:1px solid var(--cc-color-border);background:var(--cc-color-surface);transition:background var(--cc-motion-fast) var(--cc-ease),border-color var(--cc-motion-fast)}
.it:hover .bx{background:color-mix(in srgb,var(--cc-color-text) 5%,var(--cc-color-surface))}
.it input:checked+.bx{background:color-mix(in srgb,var(--cc-color-primary) 13%,var(--cc-color-surface));border-color:var(--cc-color-primary);box-shadow:inset 3px 0 0 var(--cc-color-primary)}
.it input:focus-visible+.bx{outline:2px solid var(--cc-color-primary);outline-offset:1px}
.bx .lb{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx .ct{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
.bx .ct .dq{display:inline-flex;align-items:center;gap:2px;font-weight:500;color:color-mix(in srgb,var(--cc-color-text) 70%,transparent)}
.bx .ct .dq svg.ic,.fold svg.ic{width:11px;height:11px}
.fold .dq{display:inline-flex;align-items:center;gap:2px}
.lede .dq{display:inline-flex;align-items:center;vertical-align:-2px}.lede .dq svg.ic{width:12px;height:12px}
.bx .sb{grid-column:2/4;font-size:11px;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:color-mix(in srgb,var(--cc-color-text) 62%,transparent)}
.bx .bar{position:absolute;left:8px;right:8px;bottom:3px;height:2px;border-radius:1px;background:color-mix(in srgb,var(--cc-color-text) 9%,transparent);overflow:hidden}
.bx .bar i{display:block;height:100%;width:var(--w);background:var(--cc-vis-0);animation:grow var(--cc-motion-slow) var(--cc-ease) both;animation-delay:calc(var(--lv,0ms) + var(--i,0) * 20ms)}
@keyframes grow{from{width:0}}
.it.bad .bx{border-color:color-mix(in srgb,var(--cc-color-danger) 55%,var(--cc-color-border))}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:99px;vertical-align:1px}
.badge.fail{color:var(--cc-color-danger);background:color-mix(in srgb,var(--cc-color-danger) 14%,transparent)}
.badge.sys{color:var(--cc-color-warning);background:color-mix(in srgb,var(--cc-color-warning) 14%,transparent)}
.badge svg.ic{width:11px;height:11px}
/* the connector from a picked item into the gutter */
.c1 .it input:checked+.bx::after,.c2 .it input:checked+.bx::after,.c3 .it input:checked+.bx::after,.c4 .it input:checked+.bx::after{content:"";position:absolute;top:50%;left:100%;width:calc(var(--g) + 1px);height:2px;background:var(--cc-color-primary);transform-origin:left;animation:draw var(--cc-motion-normal) var(--cc-ease) both}
@keyframes draw{from{transform:scaleX(0)}}
.fold{display:flex;align-items:center;gap:6px;height:30px;white-space:nowrap;overflow:hidden;padding:0 8px;border:1px dashed var(--cc-color-border);border-radius:var(--cc-radius-s,4px);font-size:11.5px;cursor:default;color:color-mix(in srgb,var(--cc-color-text) 66%,transparent)}
.fold .dot{width:6px;height:6px;border-radius:50%;background:var(--cc-color-danger)}
/* ---- objects and their data ---- */
.ob{border:1px solid var(--cc-color-border);border-radius:var(--cc-radius-s,4px);background:var(--cc-color-surface);padding:6px 10px;animation:colIn var(--cc-motion-normal) var(--cc-ease) backwards;animation-delay:calc(var(--lv,0ms) + var(--i,0) * 20ms)}
.ob .l1{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.ob .l1>svg.ic{flex:none}
.ob .nm{flex:1 1 150px;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob .v{margin-left:auto;max-width:100%;display:inline-flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:2px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.ob .l2{margin:3px 0 0 24px;font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;color:color-mix(in srgb,var(--cc-color-text) 66%,transparent)}
.ob .chips{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 0 24px}
.ds{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:1px 7px;border-radius:99px;font-size:11.5px;border:1px solid var(--cc-color-border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds svg.ic{width:12px;height:12px}
.ds.sys{border-color:color-mix(in srgb,var(--cc-color-warning) 70%,transparent);color:var(--cc-color-warning)}
.ob details.mo{margin:4px 0 0 24px}
.ob .mo>summary{display:inline-block;cursor:pointer;font-size:11.5px;color:var(--cc-color-primary);list-style:none}
.ob .mo>summary::-webkit-details-marker{display:none}
.ob .mo>summary::before{content:"▸ "}
.ob .mo[open]>summary::before{content:"▾ "}
.ob .grpt{font-size:11px;font-weight:600;margin:6px 0 3px;color:color-mix(in srgb,var(--cc-color-text) 70%,transparent)}
.ob .lk{font-size:11px;margin-top:6px;color:color-mix(in srgb,var(--cc-color-text) 60%,transparent)}
.ob a{color:var(--cc-color-primary);text-decoration:none;font-size:11.5px}
.ob a:hover{text-decoration:underline}
.more{font-size:11.5px;padding:4px 2px 10px;color:color-mix(in srgb,var(--cc-color-text) 60%,transparent)}
.empty{margin:auto;padding:28px;text-align:center;border:1px dashed var(--cc-color-border);border-radius:var(--cc-radius,6px);color:color-mix(in srgb,var(--cc-color-text) 70%,transparent)}
/* ---- a data set's requests: a panel inside the chip's own details, drawn under the columns ---- */
/* each chip is a details element named dsel: the browser keeps one open; Enter, Space and a click toggle it, and its panel follows it in Tab order (never write a tag inside style: the sanitizer drops the whole style) */
details.dk{display:inline-flex;max-width:100%;min-width:0}
summary.ds.dl{cursor:pointer;list-style:none;transition:border-color var(--cc-motion-fast),background var(--cc-motion-fast)}
summary.ds.dl::-webkit-details-marker{display:none}
summary.ds.dl:hover{border-color:var(--cc-color-primary)}
summary.ds.dl::after{content:"›";margin-left:2px;opacity:.6}
details.dk[open]>summary.ds{border-color:var(--cc-color-primary);background:color-mix(in srgb,var(--cc-color-primary) 16%,transparent)}
summary.ds:focus-visible,.dv .tbw:focus-visible,.ob summary:focus-visible,.ob a:focus-visible{outline:2px solid var(--cc-color-primary);outline-offset:1px}
/* the open chip's panel is fixed to the frame's lower 46%, inside Kibana's 16px body padding; a spacer of the same height after the columns (generated rule below) makes room for it */
.ip::after{content:"";display:none;flex:0 0 calc(46vh - 16px)}
/* a mask on an ancestor clips a fixed descendant too, so the objects column drops its fade while a panel is open */
.ip:has(details.dk[open]) .col.objs .scroll{mask-image:none}
.dv{position:fixed;z-index:5;left:16px;right:16px;bottom:16px;height:calc(46vh - 16px);display:flex;flex-direction:column;gap:4px;border:1px solid var(--cc-color-primary);border-radius:var(--cc-radius,6px);background:var(--cc-color-surface);padding:8px 12px 6px;font-size:13px;font-weight:400;white-space:normal;color:var(--cc-color-text);cursor:auto;animation:dvIn var(--cc-motion-normal) var(--cc-ease) both}
@keyframes dvIn{from{opacity:0;transform:translateY(10px)}}
.dv .dh{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.dv .t{font-weight:600;font-size:13.5px}
.dv .sum{font-size:12px;font-variant-numeric:tabular-nums}
.dv .hint{margin-left:auto;font-size:11.5px}
.dv .note{font-size:11.5px}
.dv .tbw{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.dv table{width:auto;min-width:min(100%,720px);border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.dv th{position:sticky;top:0;z-index:1;text-align:left;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;padding:4px 14px 4px 0;background:var(--cc-color-surface);border-bottom:1px solid var(--cc-color-border);color:color-mix(in srgb,var(--cc-color-text) 60%,transparent)}
.dv td{padding:3px 14px 3px 0;white-space:nowrap;border-bottom:1px solid color-mix(in srgb,var(--cc-color-border) 55%,transparent)}
.dv td.pp{white-space:normal;min-width:180px}
.dv td .docs{font-weight:600}
@media (max-width:1200px){.mc{--g:14px;grid-template-columns:minmax(0,1.15fr) minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) minmax(240px,1.3fr)}.bx{padding:5px 7px 7px;column-gap:6px}}
@media (max-width:980px){.mc{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);row-gap:10px}.col.objs{grid-column:1/-1}.bx::after{display:none!important}}
/* ---- generated: a node's children and crumb show only while it and every ancestor are picked ---- */
{%- for r in rows -%}{%- assign L = r["lvl"].value -%}{%- if L >= 1 and L <= 4 -%}
.ip{%- if L >= 2 -%}:has(#n{{ r["h1"].value }}:checked){%- endif -%}{%- if L >= 3 -%}:has(#n{{ r["h2"].value }}:checked){%- endif -%}{%- if L >= 4 -%}:has(#n{{ r["h3"].value }}:checked){%- endif -%}:has(#n{{ r["nid"].value }}:checked) :is(.g{{ r["nid"].value }},.b{{ r["nid"].value }}){display:flex}
.ip:has(#n{{ r["nid"].value }}:focus-visible) .b{{ r["nid"].value }}{outline:2px solid var(--cc-color-primary);outline-offset:-1px}
{%- endif -%}{%- endfor %}
{%- comment -%} the spacer under the columns, while a data set's panel is open AND shown: the path to its object still picked, and not
inside a closed All-data-sets list. Its id is the level-6 parent id, an MD5 prefix of the object's path and the data set. {%- endcomment -%}
{%- assign gp = "" -%}{%- for r in rows -%}{%- if r["lvl"].value == 6 and r["pid"].value != gp -%}{%- assign gp = r["pid"].value -%}
.ip:has(#n{{ r["h1"].value }}:checked):has(#n{{ r["h2"].value }}:checked):has(#n{{ r["h3"].value }}:checked):has(#n{{ r["h4"].value }}:checked):has(.k{{ gp }}[open]:not(.mo:not([open]) .dk))::after{display:block}
{%- endif -%}{%- endfor %}
</style>
{%- assign tot = nil -%}
{%- for r in rows -%}{%- if r["lvl"].value == 0 -%}{%- assign tot = r -%}{%- endif -%}{%- endfor -%}
{%- comment -%} dmap: "|<object id>#<data set>#<panel id>#<first row>#<requests shown>|" for every data set with a panel, so its
chip renders the panel from rows[first row] on (rows are sorted by level and parent). A chip with no entry (a name
lookup only, or cut by the row cap) is a plain label. Index names cannot hold | or #. {%- endcomment -%}
{%- assign dmap = "|" -%}{%- assign gp = "" -%}{%- assign gn = 0 -%}{%- assign gk = "" -%}
{%- for r in rows -%}{%- if r["lvl"].value == 6 -%}
{%- if r["pid"].value != gp -%}{%- if gp != "" -%}{%- assign dmap = dmap | append: gk | append: gn | append: "|" -%}{%- endif -%}
{%- assign gp = r["pid"].value -%}{%- assign gn = 0 -%}{%- assign gk = r["h5"].value | append: "#" | append: r["fm"].value | append: "#" | append: gp | append: "#" | append: forloop.index0 | append: "#" -%}{%- endif -%}
{%- assign gn = gn | plus: 1 -%}
{%- endif -%}{%- endfor -%}
{%- if gp != "" -%}{%- assign dmap = dmap | append: gk | append: gn | append: "|" -%}{%- endif -%}
<div class="ip">
{%- if tot == nil or tot["acts"].value == 0 -%}
<div class="empty"><icon name="db"/><br>No Kibana activity in this selection.<br>Widen the time range or clear a control.</div>
{%- else -%}
{%- assign o = tot["opens"].value -%}{%- assign ch = tot["creates"].value | plus: tot["changes"].value | plus: tot["deletes"].value -%}
{%- assign ls = tot["lists"].value -%}{%- assign rn = tot["runs"].value -%}{%- assign f = tot["fails"].value -%}{%- assign dq = tot["dreq"].value -%}
{%- comment -%} more than one identity in the rows (the control, a Principal id pill or Identity type can each narrow it), and the
row cap reached: one line between them. ids is counted on the level-0 row; nfmt groups its thousands. {%- endcomment -%}
{%- assign cut = false -%}{%- if rows.size >= 6000 -%}{%- assign cut = true -%}{%- endif -%}
{%- assign ni = tot["ids"].value | default: 0 -%}
{%- if ni > 1 or cut -%}<p class="hd">
{%- if ni > 1 -%}{%- assign nr = ni -%}{%- assign nfmt = "" -%}
{%- for g in (1..4) -%}{%- if nr >= 1000 -%}{%- assign m = nr | modulo: 1000 -%}{%- assign g3 = m | prepend: "00" | slice: -3, 3 -%}{%- assign nfmt = "," | append: g3 | append: nfmt -%}{%- assign nr = nr | minus: m | divided_by: 1000 -%}{%- endif -%}{%- endfor -%}
{%- assign nfmt = nr | append: nfmt -%}
<span class="who"><b>{{ nfmt }} identities.</b> Pick one in the Identity control, or click a Principal id in <i>Who this is</i>.</span>{%- endif -%}
{%- if cut -%}<span class="cut mute">Some objects and requests are not shown. Narrow the time range or pick an identity.</span>{%- endif -%}
</p>{%- endif -%}
<p class="lede">{%- assign first = true -%}
{%- if o > 0 -%}<b>{% if first %}Opened{% else %}opened{% endif %} {{ o }}×</b> · {% assign first = false %}{% endif -%}
{%- if ch > 0 -%}<b>{% if first %}Changed{% else %}changed{% endif %} {{ ch }}×</b> · {% assign first = false %}{% endif -%}
{%- if rn > 0 -%}<b>{% if first %}Ran{% else %}ran{% endif %} {{ rn }}×</b> · {% assign first = false %}{% endif -%}
{%- if ls > 0 -%}{% if first %}Listed{% else %}listed{% endif %} in <b>{{ ls }}</b> {% if ls == 1 %}search{% else %}searches{% endif %} · {% assign first = false %}{% endif -%}
{%- if f > 0 -%}<span class="warn">{{ f }} failed</span> · {% assign first = false %}{% endif -%}
{%- if dq > 0 -%}<b>{{ dq }}</b> data {% if dq == 1 %}request{% else %}requests{% endif %} read <b>{{ tot["dsets"].value }}</b> data {% if tot["dsets"].value == 1 %}set{% else %}sets{% endif %}{% if tot["sysn"].value > 0 %} ({{ tot["sysn"].value }} Elastic system){% endif %}{%- else -%}{% if first %}No{% else %}no{% endif %} data read{%- endif -%}
<span class="mute">. Each item shows Kibana actions, then <span class="dq"><icon name="db"/></span> data requests. Click a data set to see each request. Opening a dashboard makes Kibana read data; listing objects does not. Routine internals and this suite’s own dashboards are left out.</span>
</p>

<nav class="bc" aria-label="Selected path"><span class="bc-0">Path</span>
{%- for r in rows -%}{%- assign L = r["lvl"].value -%}{%- if L >= 1 and L <= 4 -%}{%- assign k = r["k"].value -%}<labels level="L" key="k"/>
<label class="bc-n b{{ r["nid"].value }}" for="n{{ r["nid"].value }}" title="{{ lbl }}">{%- if r["fails"].value > 0 -%}<span class="dot"></span>{%- endif -%}{{ lbl }}</label>
{%- endif -%}{%- endfor -%}
</nav>

<div class="mc">
{%- assign heads = "Credential|Space|Object type|Operation" | split: "|" -%}
{%- for L in (1..4) -%}
<section class="col c{{ L }}"><h4>{{ heads[forloop.index0] }}</h4><div class="cs">
{%- assign gp = "" -%}{%- assign isopen = false -%}

{%- if p != gp -%}
{%- if isopen -%}

</div>
{%- endif -%}
<div class="grp {% if L == 1 %}root{% else %}g{{ p }}{% endif %}" role="radiogroup">
{%- assign gp = p -%}{%- assign isopen = true -%}{%- assign c = 0 -%}{%- assign xa = 0 -%}{%- assign xd = 0 -%}{%- assign xf = 0 -%}
{%- assign sn = r["sib_n"].value -%}{%- assign sa = r["sib_acts"].value -%}{%- assign sk = r["sib_k"].value -%}{%- assign sd = r["sib_dreq"].value -%}{%- assign sf = r["sib_fails"].value -%}
{%- assign cap = 1000 -%}

{%- assign oo = r["opens"].value -%}{%- assign cc = r["creates"].value | plus: r["changes"].value | plus: r["deletes"].value -%}{%- assign ll = r["lists"].value -%}{%- assign dd = r["dreq"].value -%}{%- assign rr = r["runs"].value -%}
{%- capture parts -%}{%- if oo > 0 -%}opened {{ oo }} · {% endif -%}{%- if cc > 0 -%}changed {{ cc }} · {% endif -%}{%- if rr > 0 -%}ran {{ rr }} · {% endif -%}{%- if ll > 0 -%}listed {{ ll }} · {% endif -%}{%- endcapture -%}
{%- assign parts = parts | strip | remove_last: " ·" -%}
<label class="it{% if r["fails"].value > 0 %} bad{% endif %}" style="--i:{{ c }}" title="{{ lbl }}"><input type="radio" name="r{{ p }}" id="n{{ r["nid"].value }}"{% if c == 0 %} checked{% endif %}><span class="bx">
{%- assign ka = r["kacts"].value -%}
<icon var="ic"/><span class="lb">{{ lbl }}</span><span class="ct">{%- if ka > 0 -%}<span title="{{ ka }} Kibana {% if ka == 1 %}action{% else %}actions{% endif %}">{{ ka }}</span>{%- endif -%}{%- if dd > 0 -%}<span class="dq" title="{{ dd }} data {% if dd == 1 %}request{% else %}requests{% endif %} to Elasticsearch"><icon name="db"/>{{ dd }}</span>{%- endif -%}</span>
<span class="sb">{%- if r["fails"].value > 0 -%}<span class="badge fail">{{ r["fails"].value }} failed</span> {% endif -%}{%- if r["sysn"].value > 0 and L >= 3 -%}<span class="badge sys" title="Kibana read {{ r["sysn"].value }} Elastic system data {% if r["sysn"].value == 1 %}set{% else %}sets{% endif %} (names starting with a dot) under this"><icon name="db"/>{{ r["sysn"].value }} system</span> {% endif -%}{%- if L == 1 or L == 4 or parts == blank -%}{{ sub }}{%- else -%}{{ parts }}{%- endif -%}</span>
<span class="bar"><i style="--w:{{ sh }}%"></i></span></span></label>
{%- assign xa = xa | plus: ka -%}{%- assign xd = xd | plus: dd -%}{%- assign xf = xf | plus: r["fails"].value -%}
{%- endif -%}
{%- assign c = c | plus: 1 -%}
{%- endif -%}{%- endfor -%}
{%- if isopen -%}
{%- assign rest = sn | minus: c -%}{%- if c > cap -%}{%- assign rest = sn | minus: cap -%}{%- endif -%}
{%- if rest > 0 -%}{%- assign ra = sk | minus: xa -%}{%- assign rd = sd | minus: xd -%}{%- assign rf = sf | minus: xf -%}<div class="fold">{%- if rf > 0 -%}<span class="dot"></span>{%- endif -%}+{{ rest }} smaller not shown{% if ra > 0 %} · {{ ra }} {% if ra == 1 %}action{% else %}actions{% endif %}{% endif %}{% if rd > 0 %} · <span class="dq" title="{{ rd }} data requests"><icon name="db"/>{{ rd }}</span>{% endif %}</div>{%- endif -%}
</div>
{%- endif -%}
</div></section>
{%- endfor -%}

<section class="col objs"><h4>Objects &amp; the data Kibana read</h4><div class="scroll">
{%- assign gp = "" -%}{%- assign isopen = false -%}
{%- for r in rows -%}{%- if r["lvl"].value == 5 -%}
{%- assign p = r["pid"].value -%}
{%- if p != gp -%}
{%- if isopen -%}{%- assign rest = sn | minus: c -%}{%- if rest > 0 -%}<div class="more">and {{ rest }} more {% if rest == 1 %}object{% else %}objects{% endif %} on this path</div>{%- endif -%}</div>{%- endif -%}
<div class="grp g{{ p }}">
{%- assign gp = p -%}{%- assign isopen = true -%}{%- assign c = 0 -%}{%- assign sn = r["sib_n"].value -%}
{%- endif -%}
{%- assign k = r["k"].value -%}{%- assign t = r["ty"].value -%}{%- assign op = r["opn"].value -%}{%- assign L3 = 3 -%}<labels level="L3" key="t"/>
{%- assign nm = r["name"].value -%}
{%- if nm == blank -%}
{%- if k == "new" -%}{%- assign nm = "Unsaved Discover session" -%}
{%- elsif k contains "app:" -%}{%- assign app = k | remove_first: "app:" -%}{%- if app == blank -%}{%- assign nm = "Kibana (no app recorded)" -%}{%- else -%}{%- assign nm = app | replace: "-", " " | capitalize | append: " app" -%}{%- endif -%}
{%- elsif k.size > 36 -%}{%- assign head = k | slice: 0, 20 -%}{%- assign tail = k | slice: -12, 12 -%}{%- assign nm = head | append: "…" | append: tail -%}
{%- else -%}{%- assign nm = k -%}{%- endif -%}
{%- endif -%}
{%- assign oo = r["opens"].value -%}{%- assign cc = r["creates"].value | plus: r["changes"].value | plus: r["deletes"].value -%}{%- assign ll = r["lists"].value -%}{%- assign rr = r["runs"].value -%}{%- assign dd = r["dreq"].value -%}{%- assign ds = r["dsets"].value -%}
<div class="ob" style="--i:{{ c }}">
<div class="l1"><icon var="ic"/><span class="nm" title="{{ k }}">{{ nm }}</span>
<span class="v">{%- if dd > 0 -%}<span><b>{{ dd }}</b> data {% if dd == 1 %}request{% else %}requests{% endif %} · <b>{{ ds }}</b> data {% if ds == 1 %}set{% else %}sets{% endif %}</span>{%- if r["sysn"].value > 0 -%} <span class="badge sys" title="Elastic system data sets: names starting with a dot"><icon name="db"/>{{ r["sysn"].value }} system</span>{%- endif -%}{%- elsif op == "list" -%}<span class="mute">no data read</span>{%- endif -%}{%- if r["fails"].value > 0 -%} <span class="badge fail">{{ r["fails"].value }} failed</span>{%- endif -%}</span></div>
<div class="l2">{%- if k == "new" -%}<span>never saved</span>{%- elsif t contains "app:" -%}<span>no saved object</span>{%- endif -%}
{%- if oo > 0 -%}<span>opened {{ oo }}×</span>{%- endif -%}{%- if cc > 0 -%}<span>changed {{ cc }}×</span>{%- endif -%}{%- if rr > 0 -%}<span>ran {{ rr }}×</span>{%- endif -%}
{%- if ll > 0 -%}<span>appeared in {{ ll }} {% if ll == 1 %}list{% else %}lists{% endif %}</span>{%- endif -%}
<span>last {{ r["lastf"].value | date: "%b %-d %H:%M" }}</span>
{%- if t == "dashboard" and r["oid"].value != blank -%}<a href="/app/dashboards#/view/{{ r["oid"].value }}">Open dashboard ↗</a>{%- endif -%}
</div>
{%- if op == "list" and dd == 0 -%}<div class="l2">Listed only, never opened, so Kibana read no data for it.</div>
{%- elsif op == "open" and dd == 0 -%}<div class="l2">No Elasticsearch request named this object in the range.</div>{%- endif -%}
{%- assign fl = r["famlist"].value -%}
{%- if fl != blank -%}
{%- assign fams = fl | split: "|" -%}{%- assign shown = 0 -%}
<div class="chips">
{%- for pass in (1..2) -%}{%- for fm in fams -%}{%- assign c0 = fm | slice: 0 -%}
{%- assign take = false -%}{%- if pass == 1 and c0 == "." -%}{%- assign take = true -%}{%- endif -%}{%- if pass == 2 and c0 != "." -%}{%- assign take = true -%}{%- endif -%}
{%- if take and shown < 3 -%}
{%- assign lab = fm | replace: "logs-elastic_cloud.serverless_audit.", "audit log · " -%}
<dset name="fm" label="lab"/>{%- assign shown = shown | plus: 1 -%}
{%- endif -%}
{%- endfor -%}{%- endfor -%}
{%- assign extra = ds | minus: shown -%}{%- if extra > 0 -%}<span class="ds mute">+{{ extra }}</span>{%- endif -%}
</div>
{%- endif -%}
{%- if ds > 3 or r["lk"].value > 0 -%}
<details class="mo"><summary>{%- if ds > 3 -%}All {{ ds }} data sets{%- else -%}Names looked up{%- endif -%}</summary>
{%- if ds > 3 -%}
{%- assign nsys = r["sysn"].value -%}{%- assign nyour = ds | minus: nsys -%}
{%- if nyour > 0 -%}<div class="grpt">Your data ({{ nyour }})</div><div class="chips" style="margin-left:0">{%- for fm in fams -%}{%- assign c0 = fm | slice: 0 -%}{%- if c0 != "." -%}<dset name="fm" label="fm"/>{%- endif -%}{%- endfor -%}</div>{%- endif -%}
{%- if nsys > 0 -%}<div class="grpt">Elastic system ({{ nsys }})</div><div class="chips" style="margin-left:0">{%- for fm in fams -%}{%- assign c0 = fm | slice: 0 -%}{%- if c0 == "." -%}<dset name="fm" label="fm"/>{%- endif -%}{%- endfor -%}</div>{%- endif -%}
{%- endif -%}
{%- if r["lk"].value > 0 -%}<div class="lk">Also looked up the names or fields of {{ r["lk"].value }} data {% if r["lk"].value == 1 %}set{% else %}sets{% endif %}; no documents read from those lookups.</div>
{%- assign lks = r["lklist"].value | split: "|" -%}<div class="chips" style="margin-left:0">{%- for fm in lks -%}<dset name="fm" label="fm"/>{%- endfor -%}</div>{%- endif -%}
</details>
{%- endif -%}
</div>
{%- assign c = c | plus: 1 -%}
{%- endif -%}{%- endfor -%}
{%- if isopen -%}{%- assign rest = sn | minus: c -%}{%- if rest > 0 -%}<div class="more">and {{ rest }} more {% if rest == 1 %}object{% else %}objects{% endif %} on this path</div>{%- endif -%}</div>{%- endif -%}
</div></section>
</div>
{%- endif -%}
</div>
{%- comment -%} a data set's panel, written into each chip's details after its summary by expandDsets (scripts/lib/custom.mjs).
In scope: r, nm, lbl and ic of the object row; did, dst (its first request row), dct (rows shown) and dfm (the data set). {%- endcomment -%}
<dpanel>
{%- assign q0 = rows[dst] -%}{%- assign dsn = q0["sib_n"].value -%}{%- assign dsd = q0["sib_dreq"].value -%}{%- assign dsf = q0["sib_fails"].value -%}
<section class="dv" aria-label="Requests for {{ dfm }}">
<div class="dh"><icon name="db"/><span class="t">{{ dfm }}</span><span class="mute">read for</span><icon var="ic"/><span class="t">{{ nm }}</span><span class="mute">· {{ lbl }}</span>
<span class="sum">· <b>{{ dsn }}</b> {% if dsn == 1 %}query{% else %}queries{% endif %} · <b>{{ dsd }}</b> returned documents{% if dsf > 0 %} · <span class="badge fail">{{ dsf }} failed</span>{% endif %}</span>
<span class="hint mute">Press the data set again to close</span></div>
<div class="note mute">Each query Kibana ran on this data set for this object, newest first{% if dct < dsn %}; the latest {{ dct }} of {{ dsn }}{% endif %}. Name and field lookups, and Kibana’s own column discovery, are left out. The audit log records who ran what and when, not the query text.</div>
<div class="tbw"><table><thead><tr><th>Time</th><th>Part of the page</th><th>Language</th><th>Result</th></tr></thead><tbody>
{%- for q in rows offset: dst limit: dct -%}
{%- assign comp = q["k"].value | split: ";" | last -%}{%- assign pid8 = comp | split: ":" | last -%}{%- if pid8.size > 14 -%}{%- assign pid8 = pid8 | slice: 0, 8 | append: "…" -%}{%- endif -%}
{%- if comp contains "unifiedHistogram" -%}{%- assign part = "Histogram" -%}
{%- elsif comp contains "application:discover:" and comp != q["k"].value -%}{%- assign c6 = comp | slice: 0, 7 -%}{%- if c6 == "kibana:" -%}{%- assign part = "Page setup (fields, data view)" -%}{%- else -%}{%- assign part = "Results table" -%}{%- endif -%}
{%- elsif comp contains "lens:lnsDatatable:" -%}{%- assign part = "Table panel " | append: pid8 -%}
{%- elsif comp contains "lens:lnsMetric:" -%}{%- assign part = "Metric panel " | append: pid8 -%}
{%- elsif comp contains "lens:lnsXY:" -%}{%- assign part = "Chart panel " | append: pid8 -%}
{%- elsif comp contains "lens:" -%}{%- assign part = "Lens panel " | append: pid8 -%}
{%- elsif comp contains "vega:" -%}{%- assign part = "Vega panel " | append: pid8 -%}
{%- elsif comp contains "kibana:" or comp contains "application:" -%}{%- assign part = "Page itself (no panel named)" -%}
{%- else -%}{%- assign part = comp -%}{%- endif -%}
<tr><td>{{ q["lastf"].value | date: "%b %-d %H:%M:%S" }}</td><td class="pp">{{ part }}</td><td>{{ q["famlist"].value }}</td><td>{%- if q["fails"].value > 0 -%}<span class="badge fail">failed</span>{%- elsif q["dreq"].value > 0 -%}<span class="docs">returned documents</span>{%- elsif q["famlist"].value contains "ES|QL" -%}<span class="mute">no documents read</span>{%- else -%}<span class="mute">names or fields only</span>{%- endif -%}</td></tr>
{%- endfor -%}
</tbody></table></div></section>
</dpanel>
